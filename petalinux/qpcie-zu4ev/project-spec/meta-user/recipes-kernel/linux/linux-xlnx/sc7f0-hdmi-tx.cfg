# Official DRM/KMS HDMI output on the SC7F0 DISPLAY_TX bitstream.
#
# These are the symbols the display pipeline actually needs; every one of them
# is already satisfied by the 2023.2 BSP config, so this fragment is a pin, not
# a change: if a future BSP flips one, the display graph fails loudly at build
# or at probe instead of silently shipping a card with no connector.
#
#   xlnx,pl-disp            -> xlnx_pl_disp.c   (CRTC + single plane)
#   xlnx,axi-frmbuf-rd-v2.2 -> xilinx_frmbuf.c  (dmaengine read channel)
#   xlnx_drm / xlnx_bridge  -> pipeline + bridge framework the out-of-tree
#                              encoder binds against
CONFIG_DRM=y
CONFIG_DRM_KMS_HELPER=y
CONFIG_DRM_XLNX=y
CONFIG_DRM_XLNX_BRIDGE=y
CONFIG_DRM_XLNX_BRIDGE_VTC=y
CONFIG_DRM_XLNX_PL_DISP=y
CONFIG_XILINX_FRMBUF=y

# HDCP support is compiled in because DRM_XLNX_HDCP is selected by the encoder
# users in this BSP; the SC7F0 TX subsystem has no HDCP core instantiated
# (C_INCLUDE_HDCP_1_4/2_2 = false) and the device tree publishes no
# xlnx,include-hdcp-*, so nothing is authenticated or encrypted.
CONFIG_DRM_XLNX_HDCP=y

# CONFIG_DRM_XLNX_HDMITX stays OFF on purpose, and it is not the "HDMI TX
# driver" for this board.  In 6.1.30-xilinx-v2023.2 that symbol builds the
# in-tree drivers/gpu/drm/xlnx/xlnx_hdmi.c, whose of_match table contains only
# "xlnx,v-hdmi-txss1-1.1"/"xlnx,v-hdmi-txss1-1.2" (HDMI 2.1 TX SS).  Our
# v_hdmi_tx_ss 3.2 is bound by the out-of-tree official module
# xilinx-hdmi-tx.ko (hdmi/xilinx_drm_hdmi.c, compatible
# "xlnx,v-hdmi-tx-ss-3.1") from the kernel-module-hdmi recipe, which is already
# in the image.  Enabling this symbol would add a driver that can never match
# this IP and would make the running pipeline impossible to reason about.
# CONFIG_DRM_XLNX_HDMITX is not set
