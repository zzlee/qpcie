# Official framebuffer/VIPP/CSC capture prerequisites for the NEW capture image.
# Paired with matching0x26102801+ hardware and the opt-in capture DT graph.
# Existing external HDMI 2.0 modules remain; do not enable HDMI 2.1 RX instead.
CONFIG_MEDIA_SUPPORT=y
CONFIG_MEDIA_CONTROLLER=y
CONFIG_VIDEO_DEV=y
CONFIG_V4L_PLATFORM_DRIVERS=y
CONFIG_VIDEO_V4L2_SUBDEV_API=y
CONFIG_VIDEOBUF2_DMA_CONTIG=y
CONFIG_DMADEVICES=y
CONFIG_XILINX_FRMBUF=y
CONFIG_VIDEO_XILINX=y
CONFIG_VIDEO_XILINX_VPSS_CSC=y
CONFIG_VIDEO_SC7F0_FRAME_TAP=y
CONFIG_GPIO_XILINX=y
CONFIG_CMA=y
CONFIG_DMA_CMA=y
CONFIG_CMA_SIZE_MBYTES=256
