#User Configuration

#OE_TERMINAL = "tmux"

# Enable HDMI 2.0 RX Subsystem & Video PHY in device-tree for HDMI06 hardware
SC7F0_HDMI_RX_ENABLE:pn-device-tree = "1"
# This branch targets the new official framebuffer/VIPP capture image only.
SC7F0_PS_CAPTURE_ENABLE:pn-device-tree = "1"
# SC7F0_DISPLAY_TX bitstream (0x26111208+): official DRM/KMS HDMI OUTPUT graph
# (xlnx,v-hdmi-tx-ss-3.1 + xlnx,pl-disp + xlnx,axi-frmbuf-rd-v2.2 + VPHY TX
# lanes).  Requires the two flags above.
SC7F0_HDMI_TX_ENABLE:pn-device-tree = "1"
# SC7F0-RGB-COMPOSITOR-2PPC (PL base 0x26111405/0x26111501): two RGBA planes +
# alpha blend, plane-B reader at 0xB0090000, overlay ingress/plane writer at
# 0xB00A0000, and NO VCU.  This is a global (not :pn-device-tree) setting
# because petalinux-image-minimal.bbappend reads the same variable to drop the
# encoder service/firmware from the rootfs.  Kept here so a build from this
# repository produces the same device tree as the build directory that was
# actually flashed; the two were found to differ (the copy had this line, the
# repository did not), which is exactly how a personality silently disappears.
SC7F0_RGB_COMPOSITOR_ENABLE = "1"

# Isolated worktree TMPDIR; reuse only legitimate downloads/sstate caches.
# Never share the original project's work-shared kernel or build/tmp.
DL_DIR = "/home/zzlee/qpcie/petalinux/qpcie-zu4ev/build/downloads"
SSTATE_DIR = "/home/zzlee/qpcie/petalinux/qpcie-zu4ev/build/sstate-cache"
BB_NUMBER_THREADS = "4"
PARALLEL_MAKE = "-j4"
INHERIT += "rm_work"
RM_WORK_EXCLUDE += "linux-xlnx fsbl-firmware pmu-firmware arm-trusted-firmware device-tree"
TMPDIR = "${TOPDIR}/tmp"
