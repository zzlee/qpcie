#User Configuration

#OE_TERMINAL = "tmux"

# Enable HDMI 2.0 RX Subsystem & Video PHY in device-tree for HDMI06 hardware
SC7F0_HDMI_RX_ENABLE:pn-device-tree = "1"
# This branch targets the new official framebuffer/VIPP capture image only.
SC7F0_PS_CAPTURE_ENABLE:pn-device-tree = "1"

# Isolated worktree TMPDIR; reuse only legitimate downloads/sstate caches.
# Never share the original project's work-shared kernel or build/tmp.
DL_DIR = "/home/zzlee/qpcie/petalinux/qpcie-zu4ev/build/downloads"
SSTATE_DIR = "/home/zzlee/qpcie/petalinux/qpcie-zu4ev/build/sstate-cache"
BB_NUMBER_THREADS = "4"
PARALLEL_MAKE = "-j4"
INHERIT += "rm_work"
RM_WORK_EXCLUDE += "linux-xlnx fsbl-firmware pmu-firmware arm-trusted-firmware device-tree"
TMPDIR = "${TOPDIR}/tmp"
