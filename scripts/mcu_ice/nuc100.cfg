# NUC100 (P2140 board U2) via Nu-Link2 + OpenOCD
# Usage: openocd -f scripts/mcu_ice/nuc100.cfg -c "init; halt; exit"
# Requires: openocd >= 0.11 (nulink driver), Nu-Link2 on USB (VID 0416)

source [find interface/nulink.cfg]
# NOTE: nulink.cfg already selects hla_swd; do NOT re-select transport here.
source [find target/numicro.cfg]

# Conservative SWD clock for wafer-cable + on-board pulls
adapter speed 1000

init
targets
